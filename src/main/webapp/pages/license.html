<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>License 管理 - 数据脱敏平台</title>
  <style>
    :root {
      --primary: #1677ff;
      --success: #52c41a;
      --warning: #faad14;
      --error: #ff4d4f;
      --text: #333;
      --text-secondary: #666;
      --border: #d9d9d9;
      --bg: #f5f6fa;
      --card-bg: #fff;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .page-header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .page-header h1 { font-size: 20px; font-weight: 600; }
    .page-header .subtitle { color: var(--text-secondary); font-size: 14px; }

    .container { max-width: 960px; margin: 24px auto; padding: 0 16px; }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      margin-bottom: 20px;
      overflow: hidden;
    }
    .card-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-body { padding: 20px 24px; }

    /* Status Badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }
    .status-badge .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    .badge-valid      { background:#f6ffed; color:#389e0d; border:1px solid #b7eb8f; }
    .badge-valid .dot { background:#52c41a; }
    .badge-expiring   { background:#fffbe6; color:#d48806; border:1px solid #ffe58f; }
    .badge-expiring .dot { background:#faad14; }
    .badge-expired    { background:#fff2f0; color:#cf1322; border:1px solid #ffa39e; }
    .badge-expired .dot { background:#ff4d4f; }
    .badge-invalid    { background:#fff2f0; color:#cf1322; border:1px solid #ffa39e; }
    .badge-invalid .dot { background:#ff4d4f; }
    .badge-tampered   { background:#fff0f6; color:#c41d7f; border:1px solid #ffadd2; }
    .badge-tampered .dot { background:#eb2f96; }
    .badge-none       { background:#fafafa; color:#8c8c8c; border:1px solid #d9d9d9; }
    .badge-none .dot  { background:#bfbfbf; }

    /* Status Block */
    .status-block {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
    }
    .status-main { flex: 1; min-width: 240px; }
    .status-meta { display: flex; flex-wrap: wrap; gap: 16px; flex: 2; }
    .meta-item { min-width: 140px; }
    .meta-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
    .meta-value { font-size: 14px; font-weight: 500; word-break: break-all; }

    /* Alert Box */
    .alert {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-top: 12px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .alert-warning { background:#fffbe6; border:1px solid #ffe58f; color:#664d03; }
    .alert-error   { background:#fff2f0; border:1px solid #ffa39e; color:#a8071a; }
    .alert-info    { background:#e6f4ff; border:1px solid #91caff; color:#0958d9; }

    /* Info Grid */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 4px;
    }
    .info-item .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
    .info-item .value { font-size: 14px; font-weight: 500; }

    /* License Key Display */
    .license-key-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .license-key-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      background: #f5f5f5;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 10px;
      flex: 1;
      min-width: 200px;
      word-break: break-all;
      max-height: 60px;
      overflow-y: auto;
    }
    .license-key-text.revealed {
      max-height: 120px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all .2s;
      white-space: nowrap;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-default  { background:#fff; border-color:var(--border); color:var(--text); }
    .btn-default:hover:not(:disabled) { border-color:var(--primary); color:var(--primary); }
    .btn-primary  { background:var(--primary); color:#fff; border-color:var(--primary); }
    .btn-primary:hover:not(:disabled)  { background:#4096ff; }
    .btn-warning  { background:#fa8c16; color:#fff; border-color:#fa8c16; }
    .btn-warning:hover:not(:disabled)  { background:#d46b08; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    /* Feature Tags */
    .feature-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .tag {
      background: #f0f5ff;
      border: 1px solid #adc6ff;
      color: #1d39c4;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
    }

    /* Quota Items */
    .quota-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 4px;
    }
    .quota-item {
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
    }
    .quota-item .q-label { font-size: 12px; color: var(--text-secondary); }
    .quota-item .q-value { font-size: 18px; font-weight: 600; color: var(--primary); margin-top: 4px; }

    /* Form */
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 13px; font-weight: 500; margin-bottom: 6px; display: block; }
    .form-control {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      font-family: 'Courier New', Courier, monospace;
      resize: vertical;
      min-height: 80px;
    }
    .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22,119,255,.15); }

    /* Pre-validate Result */
    #preValidateResult {
      margin-top: 12px;
      display: none;
    }

    /* Audit Log Table */
    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f0f0f0; }
    th { background: #fafafa; font-weight: 600; color: var(--text-secondary); }
    tr:hover td { background: #fafafa; }
    .result-success { color: var(--success); font-weight: 500; }
    .result-failure { color: var(--error); font-weight: 500; }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #ddd;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .divider { height: 1px; background: var(--border); margin: 16px 0; }
    .section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: .5px; }

    .refresh-btn { margin-left: auto; }
    .text-muted { color: var(--text-secondary); font-size: 12px; }
  </style>
</head>
<body>

<div class="page-header">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
    <path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.35C17.25 22.15 21 17.25 21 12V7L12 2z"
          fill="#1677ff" opacity=".15" stroke="#1677ff" stroke-width="1.5"/>
    <path d="M9 12l2 2 4-4" stroke="#1677ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div>
    <h1>License 管理</h1>
    <div class="subtitle">数据脱敏平台 · 私有化部署授权管理</div>
  </div>
</div>

<div class="container">

  <!-- ===== 当前状态卡片 ===== -->
  <div class="card">
    <div class="card-header">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      当前 License 状态
      <button class="btn btn-default btn-sm refresh-btn" onclick="loadStatus()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        刷新
      </button>
    </div>
    <div class="card-body" id="statusBody">
      <div style="text-align:center;padding:24px 0;color:#bbb">
        <span class="spinner"></span>&nbsp; 加载中…
      </div>
    </div>
  </div>

  <!-- ===== 更新 License ===== -->
  <div class="card">
    <div class="card-header">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      更新 License Key
    </div>
    <div class="card-body">
      <div class="form-group">
        <label class="form-label" for="newLicenseKey">新 License Key</label>
        <textarea class="form-control" id="newLicenseKey" placeholder="粘贴新的 License Key（格式：base64url_claims.base64url_signature）" rows="4"></textarea>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-default" onclick="preValidate()" id="preValidateBtn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
          预校验
        </button>
        <button class="btn btn-primary" onclick="updateLicense()" id="updateBtn" disabled>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v14a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          更新 License
        </button>
      </div>

      <div id="preValidateResult"></div>
    </div>
  </div>

  <!-- ===== 审计日志 ===== -->
  <div class="card">
    <div class="card-header">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      更新记录（最近 20 条）
      <button class="btn btn-default btn-sm refresh-btn" onclick="loadAuditLogs()">刷新</button>
    </div>
    <div class="card-body" style="padding:0">
      <div class="table-wrapper">
        <table id="auditTable">
          <thead>
            <tr>
              <th>时间</th>
              <th>操作人</th>
              <th>IP</th>
              <th>动作</th>
              <th>新 License ID</th>
              <th>结果</th>
              <th>备注</th>
            </tr>
          </thead>
          <tbody id="auditTbody">
            <tr><td colspan="7" style="text-align:center;color:#bbb;padding:24px">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script>
  // ===== API Base =====
  const API_BASE = '/api/license';
  let preValidatedOk = false;  // 是否已通过预校验

  // ===== Utilities =====
  function ts2str(ts) {
    if (!ts || ts === 0) return '-';
    return new Date(ts * 1000).toLocaleString('zh-CN');
  }

  function fmtQuota(val) {
    if (val === undefined || val === null) return '-';
    if (val < 0) return '不限';
    return val.toLocaleString();
  }

  function statusBadge(status) {
    const map = {
      VALID:         { cls: 'badge-valid',    label: '✓ 有效' },
      EXPIRING_SOON: { cls: 'badge-expiring', label: '⚠ 即将过期' },
      EXPIRED:       { cls: 'badge-expired',  label: '✗ 已过期' },
      INVALID:       { cls: 'badge-invalid',  label: '✗ 校验失败' },
      TIME_TAMPERED: { cls: 'badge-tampered', label: '⚠ 疑似时间篡改' },
      NOT_CONFIGURED:{ cls: 'badge-none',     label: '未配置' },
    };
    const s = map[status] || map.NOT_CONFIGURED;
    return `<span class="status-badge ${s.cls}"><span class="dot"></span>${s.label}</span>`;
  }

  function alertBox(type, msg) {
    if (!msg) return '';
    const icon = type === 'warning' ? '⚠️' : type === 'error' ? '🚫' : 'ℹ️';
    return `<div class="alert alert-${type}">${icon} ${escapeHtml(msg)}</div>`;
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  // ===== License Key Display =====
  let keyRevealed = false;
  let currentFullKey = '';

  function toggleKey() {
    keyRevealed = !keyRevealed;
    const el = document.getElementById('licenseKeyText');
    const btn = document.getElementById('toggleKeyBtn');
    if (!el) return;
    if (keyRevealed) {
      el.textContent = currentFullKey || '(无)';
      el.classList.add('revealed');
      btn.textContent = '🙈 隐藏';
    } else {
      el.textContent = maskedKey(currentFullKey);
      el.classList.remove('revealed');
      btn.textContent = '👁 显示';
    }
  }

  function maskedKey(key) {
    if (!key || key.length <= 12) return '****';
    return key.slice(0, 4) + '****...' + key.slice(-4);
  }

  function copyKey() {
    if (!currentFullKey) return;
    navigator.clipboard.writeText(currentFullKey).then(() => {
      const btn = document.getElementById('copyKeyBtn');
      btn.textContent = '✅ 已复制';
      setTimeout(() => btn.textContent = '📋 复制', 2000);
    });
  }

  // ===== Load Status =====
  async function loadStatus() {
    document.getElementById('statusBody').innerHTML =
      '<div style="text-align:center;padding:24px 0;color:#bbb"><span class="spinner"></span>&nbsp; 加载中…</div>';

    try {
      // Get masked info
      const [maskedResp, fullResp] = await Promise.all([
        fetch(API_BASE),
        fetch(API_BASE + '/full')
      ]);
      const info = await maskedResp.json();
      const fullInfo = await fullResp.json();
      // /full returns the complete unmasked key in maskedLicenseKey field (name from backend DTO)
      currentFullKey = fullInfo.maskedLicenseKey || '';

      renderStatus(info);
    } catch (e) {
      document.getElementById('statusBody').innerHTML =
        `<div class="alert alert-error">🚫 加载失败：${escapeHtml(e.message)}</div>`;
    }
  }

  function renderStatus(info) {
    const s = info.status;
    let alertHtml = '';
    if (s === 'EXPIRING_SOON' || s === 'TIME_TAMPERED') {
      alertHtml = alertBox('warning', info.errorReason);
    } else if (s === 'EXPIRED' || s === 'INVALID') {
      alertHtml = alertBox('error', info.errorReason);
    }

    const keyDisplay = maskedKey(currentFullKey);

    const featuresHtml = info.features && info.features.length
      ? '<div class="feature-tags">' + info.features.map(f => `<span class="tag">${escapeHtml(f)}</span>`).join('') + '</div>'
      : '<span class="text-muted">-</span>';

    document.getElementById('statusBody').innerHTML = `
      <div class="status-block">
        <div class="status-main">
          <div class="meta-label" style="margin-bottom:8px">校验状态</div>
          ${statusBadge(s)}
          ${alertHtml}
          <div style="margin-top:12px">
            <div class="meta-label">最近校验时间</div>
            <div class="meta-value">${ts2str(info.lastValidatedAt)}</div>
          </div>
        </div>
        <div class="status-meta">
          <div class="meta-item">
            <div class="meta-label">License ID</div>
            <div class="meta-value">${escapeHtml(info.licenseId || '-')}</div>
          </div>
          <div class="meta-item">
            <div class="meta-label">客户名称</div>
            <div class="meta-value">${escapeHtml(info.customerName || '-')}</div>
          </div>
          <div class="meta-item">
            <div class="meta-label">租户 ID</div>
            <div class="meta-value">${escapeHtml(info.tenantId || '-')}</div>
          </div>
          <div class="meta-item">
            <div class="meta-label">授权方案</div>
            <div class="meta-value">${escapeHtml(info.plan || '-')}</div>
          </div>
          <div class="meta-item">
            <div class="meta-label">过期时间</div>
            <div class="meta-value">${ts2str(info.expireAt)}</div>
          </div>
          <div class="meta-item">
            <div class="meta-label">宽限期</div>
            <div class="meta-value">${info.gracePeriodDays > 0 ? info.gracePeriodDays + ' 天' : '-'}</div>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="section-title">配额限制</div>
      <div class="quota-grid">
        <div class="quota-item">
          <div class="q-label">最大用户数</div>
          <div class="q-value">${fmtQuota(info.maxUsers)}</div>
        </div>
        <div class="quota-item">
          <div class="q-label">最大 SDK 实例数</div>
          <div class="q-value">${fmtQuota(info.maxSdkInstances)}</div>
        </div>
        <div class="quota-item">
          <div class="q-label">最大每日处理量</div>
          <div class="q-value">${fmtQuota(info.maxDailyRecords)}</div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="section-title">授权功能</div>
      ${featuresHtml}

      <div class="divider"></div>

      <div class="section-title">License Key</div>
      <div class="license-key-row">
        <div class="license-key-text" id="licenseKeyText">${escapeHtml(keyDisplay)}</div>
        <button class="btn btn-default btn-sm" id="toggleKeyBtn" onclick="toggleKey()">👁 显示</button>
        <button class="btn btn-default btn-sm" id="copyKeyBtn" onclick="copyKey()">📋 复制</button>
      </div>
      <div class="text-muted" style="margin-top:6px">License Key 默认脱敏展示，点击"显示"查看完整内容</div>
    `;
  }

  // ===== Pre-validate =====
  async function preValidate() {
    const key = document.getElementById('newLicenseKey').value.trim();
    if (!key) { alert('请输入 License Key'); return; }

    preValidatedOk = false;
    document.getElementById('updateBtn').disabled = true;

    const btn = document.getElementById('preValidateBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> 校验中…';

    const resultDiv = document.getElementById('preValidateResult');
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = '';

    try {
      const resp = await fetch(API_BASE + '/validate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ licenseKey: key })
      });
      const info = await resp.json();
      renderPreValidateResult(info);
      if (info.status === 'VALID' || info.status === 'EXPIRING_SOON') {
        preValidatedOk = true;
        document.getElementById('updateBtn').disabled = false;
      }
    } catch (e) {
      resultDiv.innerHTML = `<div class="alert alert-error">🚫 请求失败：${escapeHtml(e.message)}</div>`;
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> 预校验';
    }
  }

  function renderPreValidateResult(info) {
    const s = info.status;
    let type = s === 'VALID' ? 'info' : (s === 'EXPIRING_SOON' ? 'warning' : 'error');
    let label = s === 'VALID' ? '✅ 预校验通过，可安全更新' :
                s === 'EXPIRING_SOON' ? '⚠️ 预校验通过（即将过期），可更新' :
                '❌ 预校验失败，不可更新';

    const resultDiv = document.getElementById('preValidateResult');
    resultDiv.innerHTML = `
      <div class="alert alert-${type}">
        <div style="font-weight:600">${label}</div>
        ${info.errorReason ? `<div style="margin-top:4px;font-size:12px">${escapeHtml(info.errorReason)}</div>` : ''}
        ${info.licenseId ? `
          <div style="margin-top:8px;font-size:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
            <div><b>License ID</b><br>${escapeHtml(info.licenseId)}</div>
            <div><b>客户</b><br>${escapeHtml(info.customerName || '-')}</div>
            <div><b>方案</b><br>${escapeHtml(info.plan || '-')}</div>
            <div><b>到期时间</b><br>${ts2str(info.expireAt)}</div>
            <div><b>最大用户数</b><br>${fmtQuota(info.maxUsers)}</div>
            <div><b>SDK 实例数</b><br>${fmtQuota(info.maxSdkInstances)}</div>
          </div>
        ` : ''}
      </div>
    `;
  }

  // ===== Update License =====
  async function updateLicense() {
    if (!preValidatedOk) { alert('请先进行预校验'); return; }
    const key = document.getElementById('newLicenseKey').value.trim();
    if (!key) { alert('请输入 License Key'); return; }

    if (!confirm('确定要更新 License？更新后将立即生效。')) return;

    const btn = document.getElementById('updateBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> 更新中…';

    try {
      const resp = await fetch(API_BASE, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ licenseKey: key, operator: 'admin' })
      });
      const result = await resp.json();

      if (result.status === 'VALID' || result.status === 'EXPIRING_SOON') {
        document.getElementById('newLicenseKey').value = '';
        preValidatedOk = false;
        document.getElementById('preValidateResult').style.display = 'none';
        await loadStatus();
        await loadAuditLogs();
        alert('✅ License 更新成功！');
      } else {
        alert('❌ 更新失败：' + (result.errorReason || result.status));
      }
    } catch (e) {
      alert('请求失败：' + e.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v14a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> 更新 License';
    }
  }

  // ===== Audit Logs =====
  async function loadAuditLogs() {
    try {
      const resp = await fetch(API_BASE + '/audit?limit=20');
      const data = await resp.json();
      renderAuditLogs(data.records || []);
    } catch (e) {
      document.getElementById('auditTbody').innerHTML =
        `<tr><td colspan="7" style="color:#ff4d4f;text-align:center">加载失败：${escapeHtml(e.message)}</td></tr>`;
    }
  }

  function renderAuditLogs(logs) {
    const tbody = document.getElementById('auditTbody');
    if (!logs.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#bbb;padding:24px">暂无记录</td></tr>';
      return;
    }
    tbody.innerHTML = logs.map(log => `
      <tr>
        <td>${ts2str(log.createdAt)}</td>
        <td>${escapeHtml(log.operator || '-')}</td>
        <td>${escapeHtml(log.operatorIp || '-')}</td>
        <td>${escapeHtml(log.action || '-')}</td>
        <td style="font-family:monospace;font-size:11px">${escapeHtml(log.newLicenseId || '-')}</td>
        <td class="${log.result === 'SUCCESS' ? 'result-success' : 'result-failure'}">${log.result || '-'}</td>
        <td style="font-size:12px;color:#666;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escapeHtml(log.errorMsg || '')}">${escapeHtml(log.errorMsg || '-')}</td>
      </tr>
    `).join('');
  }

  // ===== Init =====
  document.addEventListener('DOMContentLoaded', () => {
    loadStatus();
    loadAuditLogs();
    // Reset update button when key input changes
    document.getElementById('newLicenseKey').addEventListener('input', () => {
      preValidatedOk = false;
      document.getElementById('updateBtn').disabled = true;
      document.getElementById('preValidateResult').style.display = 'none';
    });
  });
</script>
</body>
</html>
