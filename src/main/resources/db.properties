# Database connection properties
# Override these in your deployment environment

db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/license_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
db.username=root
# Set DB password via environment variable or secrets manager; do NOT commit real credentials here.
# Example: export DB_PASSWORD=secret; then reference it externally in your deployment config.
# db.password is intentionally absent — configure it through your CI/CD secrets pipeline.

# Connection pool settings
db.pool.maxSize=20
db.pool.minIdle=5

# License configuration
# Leave blank to use the embedded demo public key (development only)
license.public.key=
